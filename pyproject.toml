[project]
name = "openai-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway that load-balances across multiple accounts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.4",
    "python-decouple>=3.8",
    "redis>=8.0.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2.36.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
